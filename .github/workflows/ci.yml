name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'

      - name: Lint source and tests
        run: ruff check .

      - name: Run test suite
        run: python -m pytest

      - name: Run concept experiments
        run: |
          python -m tiny_transformer.experiments.tensors
          python -m tiny_transformer.experiments.autograd
          python -m tiny_transformer.experiments.losses
          python -m tiny_transformer.experiments.optimizers
          python -m tiny_transformer.experiments.embeddings
